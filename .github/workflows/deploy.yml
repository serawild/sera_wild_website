name: Deploy to GitHub Pages

on:
  # Bei jedem Push auf main bauen & deployen
  push:
    branches: [main]
  # Manuell auslösbar
  workflow_dispatch:

# Rechte für das GitHub-Pages-Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Gleichzeitige Deploys serialisieren (laufende nicht abbrechen)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.17 benötigt Node ≥ 22.13
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Aktiviert GitHub Pages automatisch (Source = GitHub Actions),
          # damit kein manueller Schritt in den Repo-Settings nötig ist.
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
